<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeFlow - Save a Life Today</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
          theme: {
            extend: {
              fontFamily: {
                sans: ['Poppins', 'sans-serif'], // Apply the font
              },
              colors: {
                brand: '#10b981',       // Emerald 500
                brandDark: '#047857',   // Emerald 700
                brandLight: '#d1fae5',  // Emerald 100
              }
            }
          }
        }
    </script>
    <style>
        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="bg-green-50 text-green-800 font-sans flex flex-col min-h-screen">
    
    <nav class="bg-white/90 backdrop-blur-md p-4 shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{% url 'home' %}" class="text-2xl font-bold tracking-tight text-brand flex items-center gap-2">
                <span class="text-3xl">🩸LifeFlow </span> 
            </a>
            
            <div class="flex items-center gap-4">
                {% if user.is_authenticated %}
                    <a href="{% url 'dashboard' %}" class="text-gray-600 hover:text-brand font-medium transition">Dashboard</a>
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="bg-red-50 text-red-500 px-4 py-2 rounded-lg font-bold hover:bg-red-100 transition text-sm">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="text-gray-600 hover:text-brand font-semibold transition">Login</a>
                    <a href="{% url 'register' %}" class="bg-brand text-white px-5 py-2.5 rounded-full font-bold hover:bg-brandDark transition shadow-lg shadow-green-200 transform hover:-translate-y-0.5">
                        Get Started
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <div class="flex-grow">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-green-100 text-green-800 py-12 mt-12">
        <div class="container mx-auto text-center">
            <h4 class="text-2xl font-bold mb-4">LifeFlow Network</h4>
            <p class="text-green-800 mb-8 max-w-md mx-auto">Connecting heroes with hospitals instantly. Because every second counts.</p>
            <div class="border-t border-gray-800 pt-8 text-sm text-green-500">
                &copy; 2026 LifeFlow. Built with Care.
            </div>
        </div>
    </footer>
</body>
</html>
